# dsh-update-vd 的 bundle patch：把本插件插进 profile 的层叠里。
#
# 两件事：
#  1. 关掉 DSH Desktop 自带的更新行 `desktop-updates` —— 它走的是
#     「原生确认框 → 选保存位置 → 下载 DMG → 用 Finder 打开 → 你自己把 app 拖进 Applications」。
#     想保留原生流程，删掉下面这一段即可（两套更新流程同时开着会各弹各的框）。
#  2. 插入本插件。
#
# 包名如换 scope，这里和 package.json 要同步改。

- id: desktop-updates
  disabled: true

- insert:
    - id: dsh-update-vd
      name: '@mhxy13867806343/dsh-update-vd'
